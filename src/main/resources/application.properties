spring.application.name=airBnbApp

#DB Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST_NAME:localhost:${DB_PORT:5432}}/${DB_NAME:airbnb}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#API Config
server.servlet.context-path=/api/v1
holiday.api.key=${HOLIDAY_API_KEY:none}

#security
jwt.secret=${JWT_SECRET:dsdsfuipufiufnefnerinanreopsjnrenklvmerire}

#Payment
razorpay.key=${RAZORPAY_KEY}
razorpay.secret=${RAZORPAY_SECRET}
razorpay.webhook.secret=${WEB_SEC}
razorpay.currency=INR
